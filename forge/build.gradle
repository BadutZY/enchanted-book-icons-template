plugins {
	id 'com.gradleup.shadow' version '8.3.5'
}

architectury {
	platformSetupLoomIde()
	forge()
}

if (project.rootProject.ext.hasMixin) {
	loom {
		forge {
			mixinConfig 'enchantbookicons.mixins.json'
		}
	}
}

configurations {
	common {
		canBeResolved = true
		canBeConsumed = false
	}
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentForge.extendsFrom common

	shadowBundle {
		canBeResolved = true
		canBeConsumed = false
	}
}

dependencies {
	forge "net.minecraftforge:forge:${rootProject.ext.profileProp('forge_version')}"

	common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
	shadowBundle project(path: ':common', configuration: 'transformProductionForge')
}

rootProject.ext.registerMetadata(project, 'forge')

// Dev environment (runClient dari IntelliJ/Gradle): resource modul :common ada di classpath tetapi
// TIDAK dianggap bagian mod, sehingga namespace "enchantbookicons" tidak ditemukan
// (gejala: "Unable to load model ... FileNotFoundException", texture ungu-hitam).
// Solusi: salin hasil processResources :common ke resource modul loader ini. Hasil filter
// :common (mis. items/ yang dikecualikan) ikut terbawa. Duplikat dengan jar common
// yang di-bundle Shadow dibuang dengan EXCLUDE.
processResources {
	from(project(':common').tasks.named('processResources'))
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

shadowJar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	configurations = [project.configurations.shadowBundle]
	archiveClassifier = 'dev-shadow'
}

remapJar {
	inputFile.set shadowJar.archiveFile
}
